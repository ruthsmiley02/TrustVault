
<!DOCTYPE html>
<html>
<head>
    <title>TrustVault - Audit Logs</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">

        <h1>TrustVault - Audit Logs</h1>

        <h2>Activity History</h2>

        {% if logs %}

        <table border="1" cellpadding="10" cellspacing="0">

            <thead>
                <tr>
                    <th>Username</th>
                    <th>Action</th>
                    <th>Details</th>
                    <th>Date & Time</th>
                </tr>
            </thead>

            <tbody>
                {% for log in logs %}
                <tr>
                    <td>{{ log.username }}</td>
                    <td>{{ log.action }}</td>
                    <td>{{ log.details }}</td>
                    <td>{{ log.timestamp }}</td>
                </tr>
                {% endfor %}
            </tbody>

        </table>

        {% else %}

            <p>No activity recorded yet.</p>

        {% endif %}

        <br>

        <a href="{{ url_for('dashboard') }}">
            Back to Dashboard
        </a>

    </div>
</body>
</html>
